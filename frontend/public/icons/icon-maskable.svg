<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients (Full bleed without rounded corners for maskable) -->
    <radialGradient id="m-bg-glow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#18182E"/>
      <stop offset="55%" stop-color="#0C0D14"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="m-cyan-accent" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00EBFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00EBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-magenta-accent" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#FF006E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF006E" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Catalyst Diagonal Glow Gradient -->
    <linearGradient id="m-catalyst-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Subtle Tech Pattern Rings -->
    <radialGradient id="m-center-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <filter id="m-monogram-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00EBFF" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#6366F1" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon Safe Zone -->
  <rect width="512" height="512" fill="#080808"/>
  <rect width="512" height="512" fill="url(#m-bg-glow)"/>
  <rect width="512" height="512" fill="url(#m-cyan-accent)"/>
  <rect width="512" height="512" fill="url(#m-magenta-accent)"/>
  <rect width="512" height="512" fill="url(#m-center-glow)"/>

  <!-- Centered Technea Monogram Mark strictly within 75% safe area (scale 12.5) -->
  <g transform="translate(256, 256) scale(12.5) translate(-16, -16)" filter="url(#m-monogram-shadow)">
    <!-- T-Crossbar Canopy & Vertical N-Pillars -->
    <path
      d="M6.5 7.5C6.5 6.94772 6.94772 6.5 7.5 6.5H24.5C25.0523 6.5 25.5 6.94772 25.5 7.5V8.5C25.5 9.05228 25.0523 9.5 24.5 9.5H22V24.5C22 25.0523 21.5523 25.5 21 25.5H19V9.5H12.5V24.5C12.5 25.0523 12.0523 25.5 11.5 25.5H9.5C8.94772 25.5 8.5 25.0523 8.5 24.5V9.5H7.5C6.94772 9.5 6.5 9.05228 6.5 8.5V7.5Z"
      fill="#FFFFFF"
    />
    <!-- Diagonal Synthesis Vector -->
    <path
      d="M12.5 9.5H15.5L19 16.5V24.5H16L12.5 17.5V9.5Z"
      fill="url(#m-catalyst-grad)"
    />
  </g>
</svg>