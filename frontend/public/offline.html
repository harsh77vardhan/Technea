<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Technea</title>
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #080808;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }

      /* Ambient radial glows matching Technea brand */
      .glow-cyan {
        position: absolute;
        top: 15%;
        left: 20%;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(0, 235, 255, 0.12) 0%, rgba(0, 235, 255, 0) 70%);
        pointer-events: none;
        filter: blur(40px);
      }
      .glow-magenta {
        position: absolute;
        bottom: 15%;
        right: 20%;
        width: 340px;
        height: 340px;
        background: radial-gradient(circle, rgba(255, 0, 110, 0.1) 0%, rgba(255, 0, 110, 0) 70%);
        pointer-events: none;
        filter: blur(40px);
      }

      .card {
        position: relative;
        z-index: 10;
        max-width: 480px;
        width: 100%;
        background: rgba(13, 15, 22, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .logo-container {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        background: #09090b;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
      }
      .logo-container svg {
        width: 36px;
        height: 36px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: #f87171;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ef4444;
        box-shadow: 0 0 8px #ef4444;
      }

      h1 {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin-bottom: 12px;
      }

      p {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #00EBFF, #6366F1);
        color: #080808;
        font-weight: 700;
        font-size: 15px;
        padding: 13px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
        box-shadow: 0 6px 20px rgba(0, 235, 255, 0.3);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        filter: brightness(1.1);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: transparent;
        color: #cbd5e1;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 11px 20px;
        border-radius: 12px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #ffffff;
      }

      .footer-brand {
        margin-top: 28px;
        color: #64748b;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="glow-cyan" aria-hidden="true"></div>
    <div class="glow-magenta" aria-hidden="true"></div>

    <main class="card">
      <div class="logo-container">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="off-glow" x1="12.5" y1="9.5" x2="19" y2="24.5" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#818CF8" />
              <stop offset="100%" stop-color="#6366F1" />
            </linearGradient>
          </defs>
          <path d="M6.5 7.5C6.5 6.94772 6.94772 6.5 7.5 6.5H24.5C25.0523 6.5 25.5 6.94772 25.5 7.5V8.5C25.5 9.05228 25.0523 9.5 24.5 9.5H22V24.5C22 25.0523 21.5523 25.5 21 25.5H19V9.5H12.5V24.5C12.5 25.0523 12.0523 25.5 11.5 25.5H9.5C8.94772 25.5 8.5 25.0523 8.5 24.5V9.5H7.5C6.94772 9.5 6.5 9.05228 6.5 8.5V7.5Z" fill="#FFFFFF"/>
          <path d="M12.5 9.5H15.5L19 16.5V24.5H16L12.5 17.5V9.5Z" fill="url(#off-glow)"/>
        </svg>
      </div>

      <div class="badge">
        <span class="badge-dot"></span>
        <span>Offline Mode</span>
      </div>

      <h1>Connection Lost</h1>
      <p>
        Technea is currently disconnected from the network. Your learning roadmaps and AI sessions require active connectivity.
      </p>

      <div class="actions">
        <button id="retry-btn" class="btn-primary" onclick="retryConnection()">
          Retry Connection
        </button>
        <button class="btn-secondary" onclick="window.location.href='/'">
          Return to Home
        </button>
      </div>

      <div class="footer-brand">Technea AI Platform</div>
    </main>

    <script>
      function retryConnection() {
        const btn = document.getElementById('retry-btn');
        btn.textContent = 'Checking connectivity...';
        btn.disabled = true;

        if (navigator.onLine) {
          fetch('/', { credentials: 'omit', cache: 'no-store', method: 'HEAD' })
            .then(() => {
              window.location.reload();
            })
            .catch(() => {
              btn.textContent = 'Still Offline — Tap to Retry';
              btn.disabled = false;
            });
        } else {
          setTimeout(() => {
            btn.textContent = 'Still Offline — Tap to Retry';
            btn.disabled = false;
          }, 600);
        }
      }

      // Auto-reload when network reconnects
      window.addEventListener('online', () => {
        const btn = document.getElementById('retry-btn');
        btn.textContent = 'Reconnected! Loading...';
        window.location.reload();
      });
    </script>
  </body>
</html>
