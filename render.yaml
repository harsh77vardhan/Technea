# ==============================================================================
# Render Infrastructure Blueprint for Technea
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Web Service: Technea FastAPI Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: technea-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: technea-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard: e.g. ["https://technea.vercel.app"]
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API key in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DB_POOL_TIMEOUT
        value: "30"

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Service
# ------------------------------------------------------------------------------
databases:
  - name: technea-postgres
    plan: free
    databaseName: technea_db
    user: technea_user
    region: oregon
    postgresMajorVersion: "16"
