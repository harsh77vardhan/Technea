# ==============================================================================
# Render Infrastructure Blueprint for Technea
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Web Service: Technea FastAPI Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: technea-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: alembic upgrade head && python -m app.db.init_db && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: technea-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard: e.g. ["https://technea.vercel.app"]
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API key in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: FRONTEND_URL
        value: "https://technea.vercel.app"
      - key: GOOGLE_CLIENT_ID
        sync: false # Set Google OAuth Client ID in Render Dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set Google OAuth Client Secret in Render Dashboard
      - key: GOOGLE_REDIRECT_URI
        value: "https://technea-backend.onrender.com/auth/google/callback"
      - key: RESEND_API_KEY
        sync: false # Resend API Key (re_...) from Resend Dashboard for transactional emails
      - key: EMAIL_FROM
        value: "Technea <noreply@technea.in>" # Production sender address for technea.in domain
      - key: SMTP_HOST
        sync: false # Optional SMTP server hostname for fallback or direct delivery (e.g. smtp.gmail.com, email-smtp.us-east-1.amazonaws.com)
      - key: SMTP_PORT
        value: "587" # SMTP port (587 for STARTTLS, 465 for SSL)
      - key: SMTP_USER
        sync: false # SMTP username / login account
      - key: SMTP_PASSWORD
        sync: false # SMTP password / app-specific password
      - key: SMTP_TLS
        value: "true" # Enable STARTTLS encryption for SMTP
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DB_POOL_TIMEOUT
        value: "30"

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Service
# ------------------------------------------------------------------------------
databases:
  - name: technea-postgres
    plan: free
    databaseName: technea_db
    user: technea_user
    region: oregon
    postgresMajorVersion: "16"
